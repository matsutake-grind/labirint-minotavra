<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Лабиринт Минотавра</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="%23C8703F"/><circle cx="12" cy="12" r="7" fill="%231E130B"/><circle cx="12" cy="12" r="2.5" fill="%23C8703F"/></svg>'>
<link rel="stylesheet" href="./r3/hud.css">

<style>
  /* overscroll-behavior: жест оттяжки и «потянуть, чтобы обновить» на телефоне. overflow:hidden
     его не ловит — страница не прокручивается, а холст всё равно уезжает под палец. Правило было
     в 2D-игре и потерялось при переезде оболочки; нашлось, когда инварианты страницы стали
     судиться по тому, что отгружается (R4). */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1A120C; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; }
  /* T10: один шрифтовой стек на всю страницу; кнопки и поля не наследуют шрифт сами, SVG-текст — тоже явно */
  body, button, input, select, textarea, svg text { font-family: 'PT Sans', system-ui, sans-serif; }
  h1, h2, h3, h4 { font-family: 'Philosopher', 'PT Sans', sans-serif; }
</style>
</head>
<body>
<div id="zone-name"></div>
<div id="foes"></div>
<div id="toast"></div>
<div class="ovl" id="ovl-death"><div class="col">
  <h2 data-t="death"></h2>
  <p data-t="deathNote"></p>
  <button class="btn rv k-ad" id="btn-revive"><span data-t="watchAd"></span><span class="rv2" data-t="reviveAd"></span></button>
  <button class="btn k-main" id="btn-revive-entry" data-t="reviveEntry"></button>
</div></div>
<div class="ovl" id="ovl-clear"><div class="col">
  <h2 id="clear-title"></h2>
  <div class="coins" id="clear-coins"></div>
  <div class="skein" id="clear-skein"></div>
  <button class="btn rv k-ad" id="btn-double"><span data-t="watchAd"></span><span class="rv2" data-t="doubleCoins"></span></button>
  <button class="btn rv k-ad" id="btn-skein2"><span data-t="watchAd"></span><span class="rv2" data-t="doubleSkein"></span></button>
  <button class="btn k-main" id="btn-next" data-t="deeper"></button>
  <button class="btn k-2" id="btn-clear-hub" data-t="toAgora"></button>
</div></div>
<div id="level-flash" aria-hidden="true"></div>
<div class="ovl" id="ovl-title"><div class="col title-card">
  <p class="title-kicker" data-t="titleGot"></p>
  <h2 id="title-name"></h2>
  <p id="title-desc"></p>
  <button class="btn k-main" id="btn-title-ok" data-t="titleAccept"></button>
</div></div>
<div class="ovl" id="ovl-daily"><div class="col">
  <h2 data-t="dailyOver"></h2>
  <p id="daily-stats"></p>
  <p id="daily-place"></p>
  <p data-t="dailyNext"></p>
  <button class="btn k-main" id="btn-daily-hub" data-t="toAgora"></button>
</div></div>
<div class="ovl" id="ovl-tab"><div class="col">
  <p id="tab-busy"></p>
</div></div>
<div class="ovl" id="ovl-pause"><div class="col">
  <h2 data-t="pause"></h2>
  <p id="pause-daily" data-t="dailyLeaveNote" hidden></p>
  <button class="btn k-main" id="btn-resume" data-t="resume"></button>
  <button class="btn sq k-2" id="btn-pause-mute"></button>
  <button class="btn k-2" id="btn-pause-hub" data-t="toAgora"></button>
</div></div>
<div class="ovl" id="ovl-pickgod"><div class="col pickgod">
  <h2 data-t="pickGodTitle"></h2>
  <p class="pg-note"></p>

</div></div>
